<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RELMED Task Battery</title>
    <link href="core/styles/theme.css" rel="stylesheet" type="text/css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--rlm-font);
            background: var(--rlm-accent-soft);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--rlm-space-5);
            color: var(--rlm-ink);
        }

        .container {
            background: var(--rlm-surface);
            padding: clamp(24px, 6vw, 40px);
            border-radius: var(--rlm-radius-lg);
            box-shadow: var(--rlm-shadow);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--rlm-ink);
        }

        .subtitle {
            font-size: 16px;
            color: var(--rlm-ink-muted);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--rlm-ink);
            text-align: left;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid var(--rlm-line);
            border-radius: var(--rlm-radius-sm);
            transition: border-color var(--rlm-transition), box-shadow var(--rlm-transition);
            outline: none;
            background: var(--rlm-surface);
            color: var(--rlm-ink);
            font-family: var(--rlm-font);
        }

        input[type="text"]:focus,
        select:focus {
            border-color: var(--rlm-accent);
            box-shadow: 0 0 0 var(--rlm-focus-ring) rgba(74, 111, 165, 0.18);
        }

        .start-button {
            background: var(--rlm-accent);
            color: var(--rlm-surface);
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: var(--rlm-radius-sm);
            cursor: pointer;
            transition: background var(--rlm-transition), transform var(--rlm-transition);
            width: 100%;
            min-height: var(--rlm-tap-target);
            font-family: var(--rlm-font);
        }

        @media (hover: hover) {
            .start-button:hover {
                background: var(--rlm-accent-dark);
            }
        }

        .start-button:focus-visible {
            outline: var(--rlm-focus-ring) solid var(--rlm-accent);
            outline-offset: var(--rlm-focus-offset);
        }

        .start-button:active {
            transform: scale(0.98);
        }

        .start-button:disabled {
            background: var(--rlm-disabled);
            color: var(--rlm-disabled-ink);
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            color: var(--rlm-negative);
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <form id="startForm">
            <div class="form-group">
                <label for="participantId">Participant ID:</label>
                <input 
                    type="text" 
                    id="participantId" 
                    name="participantId" 
                    placeholder="Enter participant ID"
                    maxlength="236"
                    required
                    autocomplete="off"
                >
            </div>
            
            <div class="form-group">
                <label for="task">Task:</label>
                <select id="task" name="task" required>
                    <option value="">Select task</option>
                    <option value="vigour">Vigour</option>
                    <option value="reversal">Reversal</option>
                    <option value="PILT">PILT (card choosing)</option>
                    <option value="go_no_go">Faces Go/No-Go</option>
                </select>
            </div>

            <button type="submit" class="start-button" id="startButton">
                Start Experiment
            </button>
            
            <div class="error-message" id="errorMessage">
                Please enter a valid participant ID
            </div>
        </form>
    </div>

    <script type="module">
        import { participantIdValidationError } from './core/utils/participant-id.js';

        document.getElementById('startForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const participantId = document.getElementById('participantId').value.trim();
            const task = document.getElementById('task').value;
            const errorMessage = document.getElementById('errorMessage');

            // Hide error message
            errorMessage.style.display = 'none';

            const participantError = participantIdValidationError(participantId);
            if (participantError) {
                errorMessage.textContent = participantError;
                errorMessage.style.display = 'block';
                return;
            }

            // Validate task selection
            if (!task) {
                errorMessage.textContent = 'Please select a task';
                errorMessage.style.display = 'block';
                return;
            }

            // Redirect to experiment.html. There is a single data-submission route
            // (core/utils/data-handling.js posts to REDCap via an AWS Lambda endpoint), so
            // no per-run context selection is needed here.
            window.location.href = `experiment.html?participant_id=${encodeURIComponent(participantId)}&task=${encodeURIComponent(task)}`;
        });

        // Enable real-time validation
        document.getElementById('participantId').addEventListener('input', function() {
            const errorMessage = document.getElementById('errorMessage');
            if (this.value.trim()) {
                errorMessage.style.display = 'none';
            }
        });

        // Hide error message when task is selected
        document.getElementById('task').addEventListener('change', function() {
            const errorMessage = document.getElementById('errorMessage');
            if (this.value) {
                errorMessage.style.display = 'none';
            }
        });

        // Focus on the input field when page loads
        window.addEventListener('load', function() {
            document.getElementById('participantId').focus();
        });
    </script>
</body>
</html>
