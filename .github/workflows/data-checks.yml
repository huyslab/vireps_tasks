name: Data checks

# Runs on every pull request and every push to main:
#   1. The Playwright "data invariants" project (Desktop Chrome), then
#      `npm run sim:data`, which simulates PILT, the post-PILT test, reversal and
#      go/no-go with seeded randomness and publishes a complete run to
#      validation/sim-data/.
#   2. validation/analysis/run_sim_analysis.R on that run. It checks that every
#      variable the RELMED dashboard analyses need is recorded, and fails if any
#      check fails. The report and plots are uploaded as an artifact.
#   3. On pushes to main, the report and plots are committed to
#      validation/analysis/report/ if the report's text changed. The simulations
#      are seeded, so it only changes when the tasks' data do. The plots alone are
#      not compared: a new R or ggplot2 release can redraw them from the same data.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: data-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run data invariant tests
        # The task simulations run in the next step, which also saves their data.
        run: npx playwright test --project="data invariants" --grep-invert "simulate .* participant"
        env:
          CI: true

      - name: Simulate tasks
        run: npm run sim:data
        env:
          CI: true

      - name: Upload simulated data
        uses: actions/upload-artifact@v4
        with:
          name: sim-data
          path: validation/sim-data/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  sim-analysis:
    needs: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # to commit the report on pushes to main
    steps:
      - uses: actions/checkout@v4

      - name: Download simulated data
        uses: actions/download-artifact@v4
        with:
          name: sim-data
          path: validation/sim-data/

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::tidyr
            any::ggplot2
            any::jsonlite

      - name: Check variables and run analyses
        run: Rscript validation/analysis/run_sim_analysis.R

      - name: Add report to job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f validation/analysis/output/sim_report.md ]; then
            # Images are relative paths the summary cannot show; keep the tables.
            grep -v '^!\[\](' validation/analysis/output/sim_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report and plots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: sim-analysis-report
          path: validation/analysis/output/
          retention-days: 30

      - name: Commit report to main if it changed
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          git fetch --depth=1 origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main has moved on since this run started; its own run will update the report."
            exit 0
          fi
          report=validation/analysis/report
          # The report's tables and checks come from the data alone; the plots' bytes also
          # depend on the R and ggplot2 versions CI happens to install. So only a changed
          # report text means the data changed, and only then are the plots replaced too.
          if cmp -s validation/analysis/output/sim_report.md "$report/README.md"; then
            echo "Report unchanged."
            exit 0
          fi
          rm -rf "$report"
          mkdir -p "$report"
          cp validation/analysis/output/*.png "$report"/
          cp validation/analysis/output/sim_report.md "$report"/README.md
          git add -A "$report"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Update simulated-data report for ${GITHUB_SHA::7} [skip ci]"
          if ! git push origin HEAD:main; then
            # A merge can land between the check above and this push.
            git fetch --depth=1 origin main
            if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
              echo "main moved on while this run was committing; its own run will update the report."
              exit 0
            fi
            exit 1
          fi
