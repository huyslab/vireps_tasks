name: Data checks

# Runs on every pull request and every push to main:
#   1. The Playwright "data invariants" project (Desktop Chrome). This includes
#      data-sim-analysis.spec.js, which simulates PILT, the post-PILT test,
#      reversal and go/no-go and saves the data to validation/sim-data/.
#   2. validation/analysis/run_sim_analysis.R on that data. It checks that every
#      variable the RELMED dashboard analyses need is recorded, and fails if any
#      check fails. The Markdown report and plots are uploaded as an artifact.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: data-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run data invariant tests (includes task simulations)
        run: npx playwright test --project="data invariants"
        env:
          CI: true

      - name: Upload simulated data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: sim-data
          path: validation/sim-data/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  sim-analysis:
    needs: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download simulated data
        uses: actions/download-artifact@v4
        with:
          name: sim-data
          path: validation/sim-data/

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::tidyr
            any::ggplot2
            any::jsonlite

      - name: Check variables and run analyses
        run: Rscript validation/analysis/run_sim_analysis.R

      - name: Add report to job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f validation/analysis/output/sim_report.md ]; then
            # Images are relative paths the summary cannot show; keep the tables.
            grep -v '^!\[\](' validation/analysis/output/sim_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report and plots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: sim-analysis-report
          path: validation/analysis/output/
          retention-days: 30
