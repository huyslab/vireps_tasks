<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <base href="../../">
    <title>Fixture: data queue</title>

    <!-- Minimal harness exposing core/utils/data-queue.js's functions on window, so a
         Playwright spec can drive submitRecord/flushQueue/getPendingCount directly against
         a mocked network (see validation/playwright/data-queue.spec.js) without needing a
         full jsPsych timeline. -->

    <script type="importmap">
        {
            "imports": {
                "@utils/": "./core/utils/"
            }
        }
    </script>
</head>
<body>
    <script type="module">
        import {
            submitRecord,
            flushQueue,
            getPendingCount,
            listQueuedRecords,
            isQueueAvailable,
            onStorageFailure
        } from './core/utils/data-queue.js';

        window.__dataQueue = {
            submitRecord,
            flushQueue,
            getPendingCount,
            listQueuedRecords,
            isQueueAvailable,
            onStorageFailure
        };
        window.__DATA_QUEUE_FIXTURE_READY = true;
    </script>
</body>
</html>
