<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approve data-collection device</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #eef2f7;
            color: #182b4b;
            font-family: Arial, sans-serif;
        }
        main {
            width: min(520px, 100%);
            padding: 32px;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 0 12px 32px rgba(24, 43, 75, 0.12);
        }
        h1 { margin-top: 0; font-size: 26px; }
        p { line-height: 1.5; }
        label { display: block; margin: 24px 0 8px; font-weight: 600; }
        input, button {
            width: 100%;
            padding: 13px 15px;
            border-radius: 8px;
            font-size: 16px;
        }
        input { border: 2px solid #ccd5e0; }
        #enrollment-code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        .hint { margin-top: 8px; color: #475467; font-size: 14px; }
        button {
            margin-top: 16px;
            border: 0;
            background: #5a67d8;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        button:disabled { opacity: 0.6; cursor: wait; }
        #status { min-height: 24px; margin-top: 18px; }
        .error { color: #b42318; }
        .success { color: #067647; }
    </style>
</head>
<body>
    <main>
        <h1>Approve this device</h1>
        <p>Enter the single-use enrollment code generated by an administrator. Approval is stored only in this browser profile.</p>
        <form id="enrollment-form">
            <label for="enrollment-code">Enrollment code</label>
            <input id="enrollment-code" name="enrollment-code" type="text" autocomplete="off"
                autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="14"
                placeholder="XXXX-XXXX-XXXX" aria-describedby="enrollment-code-hint" required>
            <p id="enrollment-code-hint" class="hint">Hyphens, spaces and letter case do not matter.</p>
            <button id="enroll-button" type="submit">Approve device</button>
        </form>
        <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script type="module">
        import { enrollDevice, getDeviceIdentity } from './core/utils/device-auth.js';

        const form = document.getElementById('enrollment-form');
        const button = document.getElementById('enroll-button');
        const status = document.getElementById('status');
        const codeInput = document.getElementById('enrollment-code');

        function normalizeCode(value) {
            return value.toUpperCase().replace(/[\s-]/g, '');
        }

        function displayCode(value) {
            return normalizeCode(value).match(/.{1,4}/g)?.join('-') || '';
        }

        const linkedCode = new URLSearchParams(window.location.hash.slice(1)).get('code');
        if (linkedCode) {
            // URL fragments are not sent to the web server. Remove this one immediately so
            // the single-use secret does not remain visible or in the current history entry.
            history.replaceState(null, '', `${window.location.pathname}${window.location.search}`);
            codeInput.value = displayCode(linkedCode);
            status.textContent = 'Enrollment code loaded. Tap Approve device to continue.';
        }

        codeInput.addEventListener('blur', () => {
            codeInput.value = displayCode(codeInput.value);
        });

        const existingIdentity = await getDeviceIdentity();
        if (existingIdentity) {
            form.hidden = true;
            status.className = 'success';
            status.textContent = `This browser is already approved as ${existingIdentity.label}.`;
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            button.disabled = true;
            status.className = '';
            status.textContent = 'Approving device…';
            try {
                const result = await enrollDevice(normalizeCode(codeInput.value));
                form.hidden = true;
                status.className = 'success';
                status.textContent = `${result.label} is approved for data collection.`;
            } catch (error) {
                status.className = 'error';
                status.textContent = error.message;
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
