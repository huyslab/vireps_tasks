<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Installable web app. Launched from the home-screen icon the session opens with
         no browser interface at all (manifest.json sets display: fullscreen), which is
         how it is run on the study tablet. Deliberately no "orientation" in the
         manifest: tasks differ (vigour wants portrait, most want landscape) and the
         app gates orientation itself per task. -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4a6fa5">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <title>Approve data-collection device</title>
    <link href="core/styles/theme.css" rel="stylesheet" type="text/css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--rlm-accent-soft);
            color: var(--rlm-ink);
            font-family: var(--rlm-font);
        }
        main {
            width: min(520px, 100%);
            padding: clamp(24px, 6vw, 32px);
            border-radius: var(--rlm-radius-lg);
            background: var(--rlm-surface);
            box-shadow: var(--rlm-shadow);
        }
        h1 { margin-top: 0; font-size: 26px; }
        p { line-height: 1.5; }
        label { display: block; margin: 24px 0 8px; font-weight: 600; }
        input, button, .button-link {
            width: 100%;
            padding: 13px 15px;
            border-radius: var(--rlm-radius-sm);
            font-size: 16px;
            font-family: var(--rlm-font);
        }
        input {
            border: 2px solid var(--rlm-line);
            color: var(--rlm-ink);
            outline: none;
            transition: border-color var(--rlm-transition), box-shadow var(--rlm-transition);
        }
        input:focus {
            border-color: var(--rlm-accent);
            box-shadow: 0 0 0 var(--rlm-focus-ring) rgba(74, 111, 165, 0.18);
        }
        #enrollment-code {
            font-family: var(--rlm-font-mono);
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        .hint { margin-top: 8px; color: var(--rlm-ink-muted); font-size: 14px; }
        button, .button-link {
            margin-top: 16px;
            border: 0;
            background: var(--rlm-accent);
            color: var(--rlm-surface);
            font-weight: 600;
            cursor: pointer;
            min-height: var(--rlm-tap-target);
            transition: background var(--rlm-transition), transform var(--rlm-transition);
        }
        .button-link { display: block; text-align: center; text-decoration: none; }
        .button-link[hidden] { display: none; }
        @media (hover: hover) {
            button:hover, .button-link:hover { background: var(--rlm-accent-dark); }
        }
        button:focus-visible, .button-link:focus-visible {
            outline: var(--rlm-focus-ring) solid var(--rlm-accent);
            outline-offset: var(--rlm-focus-offset);
        }
        button:active, .button-link:active { transform: scale(0.98); }
        button:disabled {
            background: var(--rlm-disabled);
            color: var(--rlm-disabled-ink);
            cursor: wait;
            transform: none;
        }
        #status { min-height: 24px; margin-top: 18px; }
        .error { color: var(--rlm-negative); }
        .success { color: var(--rlm-positive); }
    </style>
</head>
<body>
    <main>
        <h1>Approve this device</h1>
        <p>Enter the single-use enrollment code generated by an administrator. Approval is stored only in this browser profile.</p>
        <form id="enrollment-form">
            <label for="enrollment-code">Enrollment code</label>
            <input id="enrollment-code" name="enrollment-code" type="text" autocomplete="off"
                autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="14"
                placeholder="XXXX-XXXX-XXXX" aria-describedby="enrollment-code-hint" required>
            <p id="enrollment-code-hint" class="hint">Hyphens, spaces and letter case do not matter.</p>
            <button id="enroll-button" type="submit">Approve device</button>
        </form>
        <p id="status" role="status" aria-live="polite"></p>
        <a id="start-button" class="button-link" href="./index.html" hidden>Start data collection</a>
    </main>

    <script type="module">
        import { enrollDevice, getDeviceIdentity } from './core/utils/device-auth.js';

        const form = document.getElementById('enrollment-form');
        const button = document.getElementById('enroll-button');
        const startButton = document.getElementById('start-button');
        const status = document.getElementById('status');
        const codeInput = document.getElementById('enrollment-code');

        function normalizeCode(value) {
            return value.toUpperCase().replace(/[\s-]/g, '');
        }

        function displayCode(value) {
            return normalizeCode(value).match(/.{1,4}/g)?.join('-') || '';
        }

        const linkedCode = new URLSearchParams(window.location.hash.slice(1)).get('code');
        if (linkedCode) {
            // URL fragments are not sent to the web server. Remove this one immediately so
            // the single-use secret does not remain visible or in the current history entry.
            history.replaceState(null, '', `${window.location.pathname}${window.location.search}`);
            codeInput.value = displayCode(linkedCode);
            status.textContent = 'Enrollment code loaded. Tap Approve device to continue.';
        }

        codeInput.addEventListener('blur', () => {
            codeInput.value = displayCode(codeInput.value);
        });

        const existingIdentity = await getDeviceIdentity();
        if (existingIdentity) {
            form.hidden = true;
            startButton.hidden = false;
            status.className = 'success';
            status.textContent = `This browser is already approved as ${existingIdentity.label}.`;
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            button.disabled = true;
            status.className = '';
            status.textContent = 'Approving device…';
            try {
                const result = await enrollDevice(normalizeCode(codeInput.value));
                form.hidden = true;
                startButton.hidden = false;
                status.className = 'success';
                status.textContent = `${result.label} is approved for data collection.`;
            } catch (error) {
                status.className = 'error';
                status.textContent = error.message;
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
